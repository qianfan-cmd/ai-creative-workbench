name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy tag (default: commit SHA; use for rollback)"
        required: false
        type: string
      skip_build:
        description: "Skip build/push; only pull & restart on ECS"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/qianfan-cmd/ai-creative-workbench
  GHCR_IMAGE_PREFIX: ghcr.io/qianfan-cmd/ai-creative-workbench

jobs:
  build-and-push:
    name: Build & push images
    if: ${{ inputs.skip_build != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        if: env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend JAR
        working-directory: backend-java
        run: mvn -B package -DskipTests

      - name: Prepare image tags
        id: image_tags
        run: |
          write_tags() {
            local name="$1"
            local file="tags-${name}.txt"
            {
              echo "${IMAGE_REPO}/${name}:${GITHUB_SHA}"
              echo "${IMAGE_REPO}/${name}:latest"
              if [ -n "${ACR_REGISTRY}" ] && [ -n "${ACR_NAMESPACE}" ]; then
                echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${name}:${GITHUB_SHA}"
                echo "${ACR_REGISTRY}/${ACR_NAMESPACE}/${name}:latest"
              fi
            } > "$file"
            echo "${name}_tags<<EOF" >> "$GITHUB_OUTPUT"
            cat "$file" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          }
          write_tags backend
          write_tags frontend
          write_tags ai
        env:
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend-java
          file: backend-java/Dockerfile.runtime
          push: true
          provenance: false    # 加这行
          sbom: false          # 加这行
          tags: ${{ steps.image_tags.outputs.backend_tags }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          push: true
          provenance: false    # 加这行
          tags: ${{ steps.image_tags.outputs.frontend_tags }}

      - name: Push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai-service-python
          file: ai-service-python/Dockerfile
          push: true
          push: true
          provenance: false    # 加这行
          tags: ${{ steps.image_tags.outputs.ai_tags }}

  deploy:
    name: Deploy on ECS
    needs: build-and-push
    if: |
      always() &&
      (needs.build-and-push.result == 'success' ||
       (inputs.skip_build == true && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          WORKBENCH_IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_IMAGE_PREFIX: ${{ env.GHCR_IMAGE_PREFIX }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 45m
          envs: WORKBENCH_IMAGE_TAG,GHCR_PAT,ECS_DEPLOY_PATH,GHCR_USER,GHCR_IMAGE_PREFIX,ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD
          script: |
            set -euo pipefail
            DEPLOY_PATH="${ECS_DEPLOY_PATH:-/root/ai-creative-workbench}"
            cd "$DEPLOY_PATH"
            git pull origin main

            {
              echo "WORKBENCH_IMAGE_TAG=${WORKBENCH_IMAGE_TAG}"
              if [ -n "${ACR_REGISTRY:-}" ] && [ -n "${ACR_NAMESPACE:-}" ]; then
                echo "IMAGE_PREFIX=${ACR_REGISTRY}/${ACR_NAMESPACE}"
              else
                echo "IMAGE_PREFIX=${GHCR_IMAGE_PREFIX}"
              fi
            } > .env.workbench

            if [ -n "${ACR_REGISTRY:-}" ] && [ -n "${ACR_USERNAME:-}" ] && [ -n "${ACR_PASSWORD:-}" ]; then
              echo "=== docker login ACR (${ACR_REGISTRY}) ==="
              echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            elif [ -n "${GHCR_PAT:-}" ]; then
              echo "=== docker login GHCR (fallback) ==="
              echo "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            COMPOSE="docker compose --env-file .env.workbench -f docker-compose.yml -f docker-compose.prod.yml"

            echo "=== pull start $(date -Is) tag=${WORKBENCH_IMAGE_TAG} prefix=$(grep IMAGE_PREFIX .env.workbench) ==="
            $COMPOSE pull backend frontend ai
            echo "=== pull done $(date -Is) ==="

            $COMPOSE up -d backend frontend ai
            $COMPOSE ps
