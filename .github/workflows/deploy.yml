name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy tag (default: commit SHA; use for rollback)"
        required: false
        type: string
      skip_build:
        description: "Skip build/push; only pull & restart on ECS"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/qianfan-cmd/ai-creative-workbench

jobs:
  build-and-push:
    name: Build & push GHCR images
    if: ${{ inputs.skip_build != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build backend JAR
        working-directory: backend-java
        run: mvn -B package -DskipTests

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend-java
          file: backend-java/Dockerfile.runtime
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/backend:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/backend:latest

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/frontend:latest

      - name: Push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai-service-python
          file: ai-service-python/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/ai:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/ai:latest

  deploy:
    name: Deploy on ECS
    needs: build-and-push
    if: |
      always() &&
      (needs.build-and-push.result == 'success' ||
       (inputs.skip_build == true && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          WORKBENCH_IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ECS_DEPLOY_PATH: ${{ secrets.ECS_DEPLOY_PATH }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          envs: WORKBENCH_IMAGE_TAG,GHCR_PAT,ECS_DEPLOY_PATH,GHCR_USER
          script: |
            set -euo pipefail
            DEPLOY_PATH="${ECS_DEPLOY_PATH:-/root/ai-creative-workbench}"
            cd "$DEPLOY_PATH"
            git pull origin main
            echo "WORKBENCH_IMAGE_TAG=${WORKBENCH_IMAGE_TAG}" > .env.workbench
            if [ -n "${GHCR_PAT:-}" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi
            docker compose --env-file .env.workbench \
              -f docker-compose.yml -f docker-compose.prod.yml \
              pull backend frontend ai
            docker compose --env-file .env.workbench \
              -f docker-compose.yml -f docker-compose.prod.yml \
              up -d backend frontend ai
            docker compose --env-file .env.workbench \
              -f docker-compose.yml -f docker-compose.prod.yml \
              ps
