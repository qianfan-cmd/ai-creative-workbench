# =============================================================================
# docker-compose.yml 是什么？
# =============================================================================
# 这是 Docker Compose 的配置文件（YAML 格式）。执行 `docker compose up -d` 时，
# Docker 会按本文件一次启动多个容器，并帮它们组网、配端口、挂数据盘。
#
# -----------------------------------------------------------------------------
# YAML 最基础语法（读下面每一行前先懂这个）
# -----------------------------------------------------------------------------
# 1) 「名字: 值」  —— 冒号前面是【键/字段名】，后面是【值】。
#    例如：  image: mysql:8.0
#            ↑键    ↑值（用哪个镜像）
#
# 2) 「名字:」下面缩进 —— 冒号后面没写值，表示【下面缩进的内容都是它的子配置】。
#    例如：  environment:        ← 父键，表示「要设置的环境变量」
#              MYSQL_PASSWORD: x  ← 子键，具体变量名和值
#
# 3) 「- 某内容」  —— 减号开头表示【列表里的一项】（可以有多项）。
#    例如：  ports:
#              - "8080:8080"     ← 列表第 1 项
#              - "8000:8000"     ← 列表第 2 项（本文件每项只写一条）
#
# 4) 缩进必须用空格（一般 2 格），同级对齐；子级比父级多缩进 2 格。
#
# 5) # 开头是注释，Docker 不会读，只给人看。
#
# 启动：docker compose up -d
# 访问：http://localhost:8088
# 更多：docs/deploy.md
# =============================================================================

# services: 【顶层键】声明「要跑哪些服务」。每个服务最终会变成一个容器。
# 下面 mysql / backend / ai / frontend 都是服务名——也是容器间互相访问用的主机名。
services:

  # ---------------------------------------------------------------------------
  # 服务 1：mysql
  # ---------------------------------------------------------------------------
  # mysql: 【服务名】自己起的名字。backend 连接数据库时写 mysql:3306，就是找这个服务。
  mysql:

    # image: 【键】用哪个镜像创建容器。相当于「安装包 / 模板」。
    # 值 = 镜像地址。这里用 DaoCloud 前缀，国内拉 docker.io 更稳定。
    image: docker.m.daocloud.io/library/mysql:8.0

    # container_name: 【键】给容器起固定名字。不设的话 Docker 会随机生成。
    # 有了它可以直接：docker logs workbench-mysql
    container_name: workbench-mysql

    # environment: 【键】传给容器内部的【环境变量】——镜像启动脚本会读这些变量来初始化。
    # 为什么需要？MySQL 官方镜像约定：用 MYSQL_ROOT_PASSWORD 设 root 密码、
    # MYSQL_DATABASE 自动建库。不写 environment，数据库不知道怎么配。
    # 写法：变量名: 值（和 .env / Linux export 类似，只是写在这个文件里）。
    environment:
      MYSQL_ROOT_PASSWORD: workbench   # MySQL root 密码
      MYSQL_DATABASE: workbench        # 首次启动时自动 CREATE DATABASE workbench

    # ports: 【键】端口映射列表——让【你的电脑】能访问【容器里】的端口。
    # 格式："宿主机端口:容器端口"
    #   左边 = 你浏览器/SQL 客户端连 localhost 用的端口
    #   右边 = 容器内部程序监听的端口（MySQL 默认 3306）
    # 3307:3306 表示：连 localhost:3307 等于连容器里的 3306，避免占你本机已有 3306。
    ports:
      - "3307:3306"

    # volumes: 【键】数据卷挂载——把【持久化磁盘】挂到【容器内路径】。
    # 为什么需要？容器删掉后，里面的文件默认会没；数据库必须持久化。
    # 格式："卷名:容器内路径" 或 "宿主机路径:容器内路径"
    #   mysql_data 是下面 volumes: 里声明的命名卷，由 Docker 管理。
    #   /var/lib/mysql 是 MySQL 存数据文件的目录。
    volumes:
      - mysql_data:/var/lib/mysql

    # healthcheck: 【键】健康检查——Docker 定期在容器里跑命令，判断服务是否真就绪。
    # 为什么需要？MySQL 容器「Started」不等于「能连上」；backend 应等数据库就绪再起。
    healthcheck:
      # test: 检查命令。mysqladmin ping 成功 = 数据库可用。
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pworkbench"]
      interval: 5s    # 每隔 5 秒检查一次
      timeout: 5s     # 单次检查最多等 5 秒
      retries: 10     # 连续失败 10 次才判 unhealthy

  # ---------------------------------------------------------------------------
  # 服务 2：backend（Spring Boot Java 后端）
  # ---------------------------------------------------------------------------
  backend:

    # 使用你本地 build 好的镜像（在 backend-java 目录 docker build -t workbench-backend .）
    image: workbench-backend:latest
    container_name: workbench-backend

    # depends_on: 【键】启动顺序 / 依赖关系——先起谁、后起谁。
    # 为什么需要？Java 启动就要连 MySQL；若 MySQL 还没起来会连库失败。
    depends_on:
      mysql:
        # condition: service_healthy 表示不仅要 mysql 容器启动，还要 healthcheck 通过。
        condition: service_healthy

    # environment: 【键】注入环境变量，Spring Boot 会自动映射到配置项。
    # 例如 SPRING_DATASOURCE_URL → spring.datasource.url
    #      APP_AI_SERVICE_BASE_URL → app.ai-service.base-url
    # 为什么需要？jar 里 application.yml 写的是 localhost，在容器里 localhost 是容器自己，
    # 连不到别的容器；必须用服务名 mysql、ai，并在这里覆盖。
    environment:
      # 注意主机名是 mysql 不是 localhost——这是 compose 内网 DNS，对应上面的 mysql 服务。
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/workbench?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: workbench
      APP_AI_SERVICE_BASE_URL: http://ai:8000
      APP_UPLOAD_DIR: /app/uploads
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_FRONTEND_BASE_URL: http://localhost:8088

    # volumes: 上传目录持久化。容器重建后用户上传的图片仍在 uploads_data 卷里。
    volumes:
      - uploads_data:/app/uploads

    # ports: 本机 8080 → 容器 8080。可直接 http://localhost:8080 调 API（调试用）。
    # 日常访问走 frontend:8088，由 Nginx 转发 /api，不一定需要记这个端口。
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------------------
  # 服务 3：ai（FastAPI Python AI 服务）
  # ---------------------------------------------------------------------------
  ai:

    image: workbench-ai:latest
    container_name: workbench-ai

    # env_file: 【键】从【外部文件】批量加载环境变量（一行一个 KEY=VALUE）。
    # 和 environment: 作用类似，但适合 secret 多、不想写进 compose 的内容（API Key）。
    # 为什么用文件？.env 已在 .gitignore，不会提交 Git；compose 只写路径引用。
    # 对比：
    #   environment:  适合少量、非敏感、和部署强相关的配置（数据库 URL 等）
    #   env_file:     适合一整份 .env（MODEL_API_KEY、DASHSCOPE_API_KEY 等）
    env_file:
      - ./ai-service-python/.env

    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # 服务 4：frontend（Nginx 托管前端静态文件）
  # ---------------------------------------------------------------------------
  frontend:

    image: workbench-frontend:latest
    container_name: workbench-frontend

    # depends_on: 只写服务名列表时，表示「等 backend 容器启动后再起 frontend」，
    # 不要求 backend healthy（Spring 没有配 healthcheck）。
    depends_on:
      - backend

    # 8088:80 —— 浏览器访问 http://localhost:8088
    # 容器内 Nginx 监听 80；/api 请求按 frontend/nginx.conf 转发到 http://backend:8080
    ports:
      - "8088:80"


# volumes: 【顶层键】声明「命名卷」——给上面的 mysql_data、uploads_data 起名字并交给 Docker 管理。
# 为什么单独写？services 里用 mysql_data:/path 挂载时，必须先在这里声明，否则 compose 报错。
# docker compose down     → 删容器，卷还在（数据保留）
# docker compose down -v  → 删容器 + 删卷（数据库清空）
volumes:
  mysql_data:     # MySQL 数据文件
  uploads_data:   # 用户上传的素材
