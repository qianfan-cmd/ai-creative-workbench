#server{} 定义一个虚拟主机块，nginx可以配置多个server，每个对应一组域名/端口和规则
server {
    listen 80; # 监听端口，80端口是HTTP的默认端口。浏览器访问http://localhost或http://域名(不带端口)时，会进这个server块
    server_name localhost; # 主机名
    root /usr/share/nginx/html; # 指定前端静态文件的根目录。构建好的前端在镜像中一般放在/usr/share/nginx/html目录下
    index index.html; # 指定默认的首页文件。访问目录时，默认返回index.html文件，这是单页应用的入口文件

    # 素材页 /assets 与 Vite 打包目录 dist/assets/ 冲突，刷新时必须回 index.html
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    # 前端路由（React Router）匹配所有'/'开头的路径
    location / {
        try_files $uri $uri/ /index.html; # 先找是否存在对应文件，再试是否是目录，都没有则返回index.html
    }

    # API 转发到 Java 后端（compose 里服务名 backend）
    # 所有/api开头的请求都走这里
    # backend:8080是java服务的名字
    location /api/ {
        proxy_pass http://backend:8080; # 不自己处理，转发给后端服务
        proxy_http_version 1.1; # 用http1.1与后端通信，利于keep-alive
        proxy_read_timeout 600s; # 知识库批量入库可能较慢
        proxy_set_header Host $host; # 把浏览器请求的host头转发给后端服务，host头是浏览器请求的域名或IP地址，例如localhost:8080
        proxy_set_header X-Real-IP $remote_addr; # 把浏览器请求的真实IP地址转发给后端服务，$remote_addr是nginx获取到的客户端IP地址
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 代理链上的IP列表，便于日志、限流、审计
    }

    # 上传文件静态访问
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}