server:
  port: 8080
  tomcat:
    # Tomcat 10.1+ 默认 multipart part 数上限为 10；知识库批量上传最多 20 个文件
    max-part-count: 30

spring:
  application:
    name: backend-java
  # 可选加载本地私密配置（不存在时不报错）
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/workbench?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    # password：本机 IDE → application-local.yml；Docker → SPRING_DATASOURCE_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart: # 上传文件限制
      max-file-size: 50MB
      # 批量上传：20 × 50MB 理论上限；实际建议单次总量控制在 500MB 内
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

jwt:
  # secret：本机 IDE → application-local.yml；ECS → .env.secrets 的 JWT_SECRET
  secret: dev-only-change-in-local-yml-or-env-min-32-chars
  expiration: 86400000

app:
  public-base-url: http://localhost:8080
  frontend-base-url: http://localhost:5173
  mail:
    provider: qq # 启动日志中显式指定邮箱服务商，可选 qq, 163, gmail
    from-name: AI Creative Workbench # 发件人显示名称
  storage:
    provider: local
    oss:
      enabled: false
      bucket: ""
      public-base-url: ""
  ai-service:
    base-url: http://localhost:8000   # Python FastAPI 地址
  upload:
    dir: E:/ai-creative-workbench/uploads #本地存储目录
    max-size: 52428800 #50MB
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,md
  ai-pricing:
    provider-aliases:
      deepseek: deepseek-v4-flash
      seedream: doubao-seedream-5-0-260128
      dashscope_wanx: wan2.7-image-pro
    models:
      deepseek-v4-flash:
        input-cache-miss-per-million-min: 1.5
        input-cache-miss-per-million-max: 3.0
        output-per-million-min: 4.5
        output-per-million-max: 9.0
        source-url: https://api-docs.deepseek.com/zh-cn/quick_start/pricing
        formula: "prompt×输入单价/M + completion×输出单价/M（空闲～高峰区间，输入按缓存未命中）"
      text-embedding-v2:
        input-per-million: 0.7
        source-url: https://help.aliyun.com/zh/model-studio/text-embedding-v2
        formula: "total_tokens × 0.7 / 1,000,000"
      # 键名含 '.' 必须用引号，否则 Spring 会解析成嵌套路径导致定价加载失败
      "[wan2.7-image-pro]":
        per-image: 0.5
        source-url: https://help.aliyun.com/zh/model-studio/wan2-7-image-pro
        formula: "0.5 × 成功生成张数（华北2 北京，图片生成）"
      doubao-seedream-5-0-260128:
        per-image: 0.22
        source-url: https://docs.volcengine.com/docs/82379/1544106?lang=zh
        formula: "0.22 × 成功生成张数"
      qwen-vl-max:
        input-per-million: 1.6
        output-per-million: 4.0
        source-url: https://help.aliyun.com/zh/model-studio/qwen-vl-max
        formula: "prompt×1.6/M + completion×4.0/M（元素识别，华北2）"

