server:
  port: 8080

spring:
  application:
    name: backend-java
  # 可选加载本地私密配置（不存在时不报错）
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/workbench?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: xxxxxx
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart: # 上传文件限制
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

jwt:
  secret: xxxx
  expiration: 86400000

app:
  public-base-url: http://localhost:8080
  upload:
    dir: E:/ai-creative-workbench/uploads #本地存储目录
    max-size: 52428800 #50MB
    allowed-extensions: jpg,jpeg,png,gif,webp,pdf,md
