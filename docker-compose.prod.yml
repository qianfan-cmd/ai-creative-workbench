# 生产环境覆盖：与 docker-compose.yml 一起使用
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# CD 部署时 .env.workbench 注入：
#   WORKBENCH_IMAGE_TAG=<commit-sha>
#   IMAGE_PREFIX=<registry/namespace>  （ACR 或 GHCR，由 deploy.yml SSH 脚本写入）
services:
  backend:
    image: ${IMAGE_PREFIX}/backend:${WORKBENCH_IMAGE_TAG:-latest}
    env_file:
      - .env.secrets
    environment:
      APP_PUBLIC_BASE_URL: http://8.148.238.164:8088
      APP_FRONTEND_BASE_URL: http://8.148.238.164:8088

  ai:
    image: ${IMAGE_PREFIX}/ai:${WORKBENCH_IMAGE_TAG:-latest}

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${WORKBENCH_IMAGE_TAG:-latest}
